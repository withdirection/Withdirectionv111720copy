<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WITHdirection | Deaf-Led Sign Language Interpreting and Consulting</title>
    <meta name="description" content="WITHdirection is a Deaf-led sign language interpreting and consulting firm based in Brooklyn, NY. Expert ASL interpretation, accessibility consulting, and training." />

    <!-- Consent gate. Loads Google Analytics, MailerLite and Tally only after
         the visitor opts in. See src/consent.ts. -->
    <script type="module" src="/src/consent-bootstrap.ts"></script>

    <style>html, body { height: 100%; margin: 0; } #root { min-height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- GDPR Cookie Consent Banner -->
    <div id="wd-cookie-banner" hidden style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#14213D;border-top:1px solid rgba(0,169,224,0.3);padding:16px 24px;font-family:'Fira Sans',sans-serif;">
      <div style="max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
        <p style="color:#E6E9EF;font-size:14px;margin:0;flex:1;min-width:240px;line-height:1.5;">
          We use cookies for analytics and to improve your experience. By accepting, you consent to our use of cookies as described in our <a href="/privacy" style="color:#00A9E0;text-decoration:underline;">Privacy Policy</a>.
        </p>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button onclick="window.__wdConsent && window.__wdConsent.decline()" style="background:transparent;border:1px solid #E6E9EF;color:#E6E9EF;padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Decline</button>
          <button onclick="window.__wdConsent && window.__wdConsent.accept()" style="background:linear-gradient(135deg,#00A9E0,#0090c0);border:none;color:white;padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit;">Accept</button>
        </div>
      </div>
    </div>
  </body>
</html>
